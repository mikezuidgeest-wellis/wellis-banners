<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetWellis - 728x90</title>
<meta name="ad.size" content="width=728,height=90">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="ad-container" data-asset-base="../assets/" data-lang="nl" data-click-url="https://www.getwellis.com" class="ad-container" role="link" tabindex="0"
       aria-label="GetWellis – Stop met uitstellen, start met medisch afvallen. Start vandaag.">
    <div class="bg-color"></div>

    <!-- Story system: photo + headline cross-fade together -->
    <div id="story-system" class="story-system">
      <div class="slide is-active">
        <div class="hero-container">
          <div class="hero-image-wrapper">
            <img class="hero-image" id="personA" alt="Tevreden klant">
          </div>
        </div>
        <div class="headline-container">
          <div class="headline" id="headlineA" data-maxh="46"></div>
        </div>
      </div>
      <div class="slide">
        <div class="hero-container">
          <div class="hero-image-wrapper">
            <img class="hero-image" id="personB" alt="Tevreden klant">
          </div>
        </div>
        <div class="headline-container">
          <div class="headline" id="headlineB" data-maxh="46"></div>
        </div>
      </div>
    </div>

    <!-- Static logo -->
    <div class="logo-container">
      <img class="logo-image" src="../assets/Wellis-Logo-Pink-RGB.svg" alt="Wellis logo">
    </div>

    <!-- Static CTA -->
    <div class="cta-container">
      <span class="cta-button">
        <span class="cta-label">Start vandaag</span>
        <span class="cta-arrow" aria-hidden="true"><svg class="cta-chev" viewBox="0 0 9 16" fill="none" xmlns="https://www.w3.org/2000/svg"><path d="M2.5 3.5 6.5 8 2.5 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cta-shine"></span>
      </span>
    </div>
  </div>
<script src="../shared/banner-data.js"></script>
<script src="../shared/_i18n.js"></script>
<script src="../shared/randomizer.js"></script>
<script src="../shared/script.js"></script>
</body>
</html>
