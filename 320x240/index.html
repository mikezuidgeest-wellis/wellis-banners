<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetWellis - 320x240</title>
<meta name="ad.size" content="width=320,height=240">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="ad-container" data-asset-base="../assets/" data-lang="nl" data-click-url="https://www.getwellis.com" class="ad-container" role="link" tabindex="0"
       aria-label="GetWellis – Stop met uitstellen, start met medisch afvallen. Vanaf 179 euro per maand. Start met afvallen.">
    <div class="bg-color"></div>
    <div id="story-system" class="story-system">
      <div class="slide is-active">
        <div class="hero-container"><div class="hero-image-wrapper">
          <img class="hero-image" id="personA" alt="Tevreden klant"></div></div>
        <div class="headline-container">
          <div class="headline" id="headlineA" data-maxh="102"></div>
        </div>
      </div>
      <div class="slide">
        <div class="hero-container"><div class="hero-image-wrapper">
          <img class="hero-image" id="personB" alt="Tevreden klant"></div></div>
        <div class="headline-container">
          <div class="headline" id="headlineB" data-maxh="102"></div>
        </div>
      </div>
    </div>
    <div class="logo-container"><img class="logo-image" src="../assets/Wellis-Logo-Pink-RGB.svg" alt="Wellis logo"></div>
    <div class="price-container">
      <img class="price-stamp-bg" src="../assets/Insert-prize-stamp.svg" alt="">
      <div class="price-content">
        <span class="price-sub price-vanaf">vanaf</span>
        <span class="price-main">&euro;149</span>
        <span class="price-sub">maand</span>
      </div>
    </div>
    <div class="cta-container">
      <span class="cta-button"><span class="cta-label">Start met afvallen</span><span class="cta-arrow" aria-hidden="true"><svg class="cta-chev" viewBox="0 0 9 16" fill="none" xmlns="https://www.w3.org/2000/svg"><path d="M2.5 3.5 6.5 8 2.5 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cta-shine"></span></span>
    </div>
    <div class="trust-container">
      <img class="tp-logo" src="../assets/Trustpilot_brandmark_gr-blk-RGB.svg" alt="Trustpilot">
      <div class="tp-stars-mask"><img class="tp-stars" src="../assets/Trustpilot_ratings_4halfstar-RGB.svg" alt="4,5 van 5 sterren"></div>
      <span class="tp-reviews"><span class="tp-score">4.7</span>/5 van <span id="tp-counter">2.720</span>+ reviews.</span>
    </div>
  </div>
<script src="../shared/banner-data.js"></script>
<script src="../shared/_i18n.js"></script>
<script src="../shared/randomizer.js"></script>
<script src="../shared/script.js"></script>
</body>
</html>
