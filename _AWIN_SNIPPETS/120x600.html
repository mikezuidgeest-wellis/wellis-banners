<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetWellis - 120x600</title>
<meta name="ad.size" content="width=120,height=600">
<base href="https://mikezuidgeest-wellis.github.io/wellis-banners/120x600/">
<link rel="stylesheet" href="https://mikezuidgeest-wellis.github.io/wellis-banners/120x600/styles.css">
</head>
<body>
<noscript><style></style></noscript>
<div id="ad-container" data-asset-base="https://mikezuidgeest-wellis.github.io/wellis-banners/assets/" data-lang="nl" data-click-url="https://www.getwellis.com/" class="ad-container" data-skip-headlines="Wetenschappelijk bewezen aanpak.|Jouw steun in de rug voor succesvol gewichtsverlies." role="link" tabindex="0"
       aria-label="GetWellis – Stop met uitstellen, start met medisch afvallen. Vanaf 179 euro per maand. Meer weten?">
    <div class="bg-color"></div>
    <div id="story-system" class="story-system">
      <div class="slide is-active">
        <div class="hero-container"><div class="hero-image-wrapper">
          <img class="hero-image" id="personA" alt="Tevreden klant"></div></div>
        <div class="headline-container">
          <div class="headline" id="headlineA" data-maxh="110">Start met medisch afvallen.</div>
        </div>
      </div>
      <div class="slide">
        <div class="hero-container"><div class="hero-image-wrapper">
          <img class="hero-image" id="personB" alt="Tevreden klant"></div></div>
        <div class="headline-container">
          <div class="headline" id="headlineB" data-maxh="110">Start met medisch afvallen.</div>
        </div>
      </div>
    </div>
    <div class="logo-container"><img class="logo-image" src="https://mikezuidgeest-wellis.github.io/wellis-banners/assets/Wellis-Logo-Pink-RGB.svg" alt="Wellis logo"></div>
    <div class="price-container">
      <img class="price-stamp-bg" src="https://mikezuidgeest-wellis.github.io/wellis-banners/assets/Insert-prize-stamp.svg" alt="">
      <div class="price-content">
        <span class="price-sub price-vanaf">vanaf</span>
        <span class="price-main">&euro;149</span>
        <span class="price-sub">maand</span>
      </div>
    </div>
    <div class="cta-container">
      <span class="cta-button"><span class="cta-label">Meer weten?</span><span class="cta-arrow" aria-hidden="true"><svg class="cta-chev" viewBox="0 0 9 16" fill="none" xmlns="https://www.w3.org/2000/svg"><path d="M2.5 3.5 6.5 8 2.5 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cta-shine"></span></span>
    </div>
    <div class="trust-container">
      <div class="tp-row">
        <span class="tp-rating"><span class="tp-score">4.7</span><span class="tp-of">/5</span></span>
        <div class="tp-stars-mask"><img class="tp-stars" src="https://mikezuidgeest-wellis.github.io/wellis-banners/assets/Trustpilot_ratings_4halfstar-RGB.svg" alt="4,5 van 5 sterren"></div>
      </div>
      <span class="tp-reviews"><span id="tp-counter">2.720</span>+ reviews.</span>
    </div>
  </div>
<script src="https://mikezuidgeest-wellis.github.io/wellis-banners/shared/banner-data.js"></script>
<script src="https://mikezuidgeest-wellis.github.io/wellis-banners/shared/randomizer.js"></script>
<script src="https://mikezuidgeest-wellis.github.io/wellis-banners/shared/script.js"></script>
</body>
</html>
