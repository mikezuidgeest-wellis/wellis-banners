<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GetWellis DE - 200x200</title>
<meta name="ad.size" content="width=200,height=200">
<base href="https://mikezuidgeest-wellis.github.io/wellis-banners/200x200/">
<link rel="stylesheet" href="https://mikezuidgeest-wellis.github.io/wellis-banners/200x200/styles.css">
</head>
<body>
<noscript><style>.ad-container *{animation:none!important;transition:none!important;}
  .ad-container .hero-image-wrapper{opacity:1;transform:none;}.ad-container .logo-container,
.ad-container .headline,
.ad-container .cta-button{opacity:1!important;transform:none!important;filter:none!important;}</style></noscript>
<div id="ad-container" data-asset-base="https://mikezuidgeest-wellis.github.io/wellis-banners/assets/" data-lang="de" data-click-url="https://www.getwellis.de/" class="ad-container" role="link" tabindex="0"
       aria-label="GetWellis – Schluss mit Aufschieben – jetzt medizinisch abnehmen. Jetzt abnehmen.">
    <div class="bg-color"></div>
    <div id="story-system" class="story-system">
      <div class="slide is-active">
        <div class="hero-container"><div class="hero-image-wrapper">
          <img class="hero-image" id="personA" alt="Zufriedene Kundin"></div></div>
        <div class="headline-container">
          <div class="headline" id="headlineA" data-maxh="48">Jetzt medizinisch abnehmen.</div>
        </div>
      </div>
      <div class="slide">
        <div class="hero-container"><div class="hero-image-wrapper">
          <img class="hero-image" id="personB" alt="Zufriedene Kundin"></div></div>
        <div class="headline-container">
          <div class="headline" id="headlineB" data-maxh="48">Jetzt medizinisch abnehmen.</div>
        </div>
      </div>
    </div>
    <div class="logo-container"><img class="logo-image" src="https://mikezuidgeest-wellis.github.io/wellis-banners/assets/Wellis-Logo-Pink-RGB.svg" alt="Wellis Logo"></div>
    <div class="price-container">
      <img class="price-stamp-bg" src="https://mikezuidgeest-wellis.github.io/wellis-banners/assets/Insert-prize-stamp.svg" alt="">
      <div class="price-content">
        <span class="price-sub price-vanaf">ab</span>
        <span class="price-main">172 &euro;</span>
        <span class="price-sub">Monat</span>
      </div>
    </div>
    <div class="cta-container">
      <span class="cta-button"><span class="cta-label">Jetzt abnehmen</span><span class="cta-arrow" aria-hidden="true"><svg class="cta-chev" viewBox="0 0 9 16" fill="none" xmlns="https://www.w3.org/2000/svg"><path d="M2.5 3.5 6.5 8 2.5 12.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="cta-shine"></span></span>
    </div>
  </div>
<script src="https://mikezuidgeest-wellis.github.io/wellis-banners/shared/banner-data-de.js"></script>
<script src="https://mikezuidgeest-wellis.github.io/wellis-banners/shared/_i18n.js"></script>
<script src="https://mikezuidgeest-wellis.github.io/wellis-banners/shared/randomizer.js"></script>
<script src="https://mikezuidgeest-wellis.github.io/wellis-banners/shared/script.js"></script>
</body>
</html>
